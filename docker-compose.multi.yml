services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: home-tution-backend
    ports:
      - "${BACKEND_PORT:-5000}:5000"
    environment:
      NODE_ENV: development
      PORT: 5000
      JWT_SECRET: ${JWT_SECRET:-dev-secret-key}
      CATALYST_PROJECT_ID: ${CATALYST_PROJECT_ID}
      CATALYST_API_KEY: ${CATALYST_API_KEY}
      ZOHO_MAIL_HOST: ${ZOHO_MAIL_HOST}
      ZOHO_MAIL_PORT: ${ZOHO_MAIL_PORT}
      ZOHO_MAIL_USER: ${ZOHO_MAIL_USER}
      ZOHO_MAIL_PASSWORD: ${ZOHO_MAIL_PASSWORD}
      GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY}
    volumes:
      - ./backend/src:/app/src
    networks:
      - home-tution-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  frontend-main:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: home-tution-frontend-main
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://backend:5000
      NEXT_PUBLIC_APP_URL: http://localhost:${FRONTEND_PORT:-3000}
      NODE_ENV: development
    volumes:
      - ./frontend/app:/app/app
      - ./frontend/components:/app/components
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - home-tution-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  tutor-portal:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: home-tution-tutor-portal
    ports:
      - "${TUTOR_PORTAL_PORT:-3001}:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://backend:5000
      NEXT_PUBLIC_APP_URL: http://localhost:${TUTOR_PORTAL_PORT:-3001}
      NODE_ENV: development
    volumes:
      - ./frontend/app:/app/app
      - ./frontend/components:/app/components
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - home-tution-network

  parent-portal:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: home-tution-parent-portal
    ports:
      - "${PARENT_PORTAL_PORT:-3002}:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://backend:5000
      NEXT_PUBLIC_APP_URL: http://localhost:${PARENT_PORTAL_PORT:-3002}
      NODE_ENV: development
    volumes:
      - ./frontend/app:/app/app
      - ./frontend/components:/app/components
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - home-tution-network

  admin-portal:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: home-tution-admin-portal
    ports:
      - "${ADMIN_PORTAL_PORT:-3003}:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://backend:5000
      NEXT_PUBLIC_APP_URL: http://localhost:${ADMIN_PORTAL_PORT:-3003}
      NODE_ENV: development
    volumes:
      - ./frontend/app:/app/app
      - ./frontend/components:/app/components
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - home-tution-network

networks:
  home-tution-network:
    driver: bridge

volumes:
  backend_node_modules:
  frontend_node_modules:
