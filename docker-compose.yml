# Local development stack: MongoDB (single-node replica set, so transactions work as on Atlas),
# the API and the website. Code changes in backend/src and frontend/ reload automatically.
#
#   docker compose up            everything
#   docker compose up -d mongo   only the database (then run the API and web with npm run dev)
#
# Production on AWS uses deploy/aws/docker-compose.prod.yml instead.
services:
  mongo:
    image: mongo:7
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      # Starts the replica set on first run, then reports healthy.
      test: ["CMD", "mongosh", "--quiet", "--eval", "try { rs.status().ok } catch (e) { rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: 'localhost:27017' }] }).ok }"]
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 10s

  backend:
    image: node:20-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev"
    ports:
      - "${BACKEND_PORT:-5000}:5000"
    env_file:
      - path: .env.local
        required: false
    environment:
      PORT: 5000
      MONGODB_URI: mongodb://mongo:27017/hometutor?directConnection=true
      STORAGE_DRIVER: local
      UPLOADS_DIR: /app/data/uploads
      CORS_ORIGINS: http://localhost:${FRONTEND_PORT:-3000}
    volumes:
      - ./backend:/app
      - backend_node_modules:/app/node_modules
    depends_on:
      mongo:
        condition: service_healthy

  frontend:
    image: node:20-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev"
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:${BACKEND_PORT:-5000}
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - backend

volumes:
  mongo_data:
  backend_node_modules:
  frontend_node_modules:
